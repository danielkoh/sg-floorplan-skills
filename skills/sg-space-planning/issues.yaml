# Layout issues that put buyers off, how to work round them with loose furniture or habits,
# and which households feel each one least. Read by issues.py; read it yourself before writing
# any issue into a script.
#
# Detection reads floorplan checklist rows: <data-dir>/<slug>/floorplan-checklist.draft.json (see CHECKLIST.md).
# A detected issue is a lead, not a finding, until it is confirmed on the plan image.
#
# who_less / who_more are judgements about households, not data. Say them as "one household
# this matters less to", never "this unit is for X". They never name race, religion, nationality
# or anything else a buyer cannot change about themselves; household make-up, habits and stage
# of life only.
#
# workarounds: loose furniture and habits only. Anything fixed, wired, plumbed or hacked is
# tagged needs_reno_check and must not be said until a renovation rule confirms it:
#   python3 <sg-reno-rules>/verify.py --workaround "<reno_workaround>"

version: 1
updated: 2026-11-03

issues:

  - id: kitchen_internal
    rubric: kitchen_ventilation
    title: Kitchen without a window
    detect: {field: kitchen_window, pattern: "none|internal"}
    costs: Cooking smoke and smell have nowhere to go but the hood and the living room; no daylight while cooking.
    who_less:
      - households that cook light — steaming, air-fryer, reheating — or eat out most weekdays
      - couples without children who order in or eat at the office
      - tenants and investors renting to working professionals
    who_more:
      - families who wok-fry daily
      - households where a helper cooks every meal
    workarounds:
      - keep the hood running for a while after cooking, not just while the wok is on (habit)
      - a freestanding air purifier sized for the living-dining area
      - {text: swap a gas hob for induction, needs_reno_check: true, reno_workaround: "swap a gas hob for induction"}

  - id: kitchen_window_to_ledge
    rubric: kitchen_ventilation
    title: Kitchen's only window faces an AC ledge or recess
    unless: [kitchen_internal]   # issues are checked in file order; an internal kitchen is the bigger issue
    detect:
      any:
        - {field: kitchen_window, pattern: "ledge"}
        - {field: minuses, pattern: "kitchen[^|]{0,80}(window|air)[^|]{0,60}(ac|a/c) ledge|kitchen[^|]{0,60}ledge recess"}
    costs: Some air, little light; the view is condenser units.
    who_less:
      - light cooks
      - households who use the kitchen mainly in the evening
    who_more:
      - daily heavy cooking
    workarounds:
      - keep the window and the hood both working when cooking (habit)

  - id: open_kitchen
    rubric: kitchen_ventilation
    title: Open kitchen beside living or dining
    detect: {any_field: [kitchen_enclosure, minuses], pattern: "open kitchen|kitchen (is )?(fully )?open|cannot be closed off|no way to close it off"}
    costs: Smell and oil reach the sofa and curtains; cooking noise reaches the living room.
    who_less:
      - light cooks; people who like to talk to guests while cooking
      - couples without children
    who_more:
      - wok cooking households, especially when the kitchen also has no window
    workarounds:
      - fabric choices that wipe or wash (loose covers, washable curtains)
      - {text: add a glass sliding partition, needs_reno_check: true, reno_workaround: "add a glass sliding partition"}

  - id: no_foyer
    rubric: entry_sequence
    title: Front door opens straight into the kitchen or a passage, no foyer
    detect: {any_field: [minuses, family_name], pattern: "no foyer|walk in through the kitchen|front door opens into the kitchen|entry strip runs straight into the kitchen"}
    costs: Nowhere to drop shoes, bags and parcels; the kitchen is the first thing a visitor sees.
    who_less:
      - one or two adults with few shoes and few visitors
    who_more:
      - families with children (shoes, prams, school bags)
      - households who host often
    workarounds:
      - a slim shoe cabinet (0.30–0.35 m deep) on the entry wall, if the door swing allows — check with fit.py
      - a runner rug and a wall-free coat stand to mark a landing zone

  - id: high_circulation
    rubric: corridor_waste
    title: More floor than usual goes to corridors and passages
    detect: {computed: circulation_top_quartile}
    costs: Floor you pay for and only walk through; corridors are often unlit.
    who_less:
      - households who value bedrooms tucked away from the living room — the corridor buys that separation
      - multi-generation households (privacy between generations)
    who_more:
      - anyone comparing price per usable square foot
    workarounds:
      - a corridor wide enough (0.9 m+) can take a 0.30 m-deep bookcase or shoe cabinet — check with fit.py routes
      - wall-free runner lighting (plug-in) for an unlit corridor

  - id: bathroom_no_window
    rubric: null
    title: Bathroom without a window
    detect: {field: bathrooms_without_window, pattern: "^(?!none)(?!\\s*$).+", exclude: "assessed|unavailable|ledge-only"}
    costs: Damp and mould if the exhaust fan is not run; no daylight.
    who_less:
      - most households who run the fan and dry towels elsewhere
    who_more:
      - households who air-dry towels in the bathroom
    workarounds:
      - leave the exhaust fan running after showers (habit)
      - a squeegee and a small portable dehumidifier

  - id: no_shelter_no_yard
    rubric: service_area
    title: No household shelter and no yard — no store room, nowhere obvious to dry laundry
    detect: {all: [{field: household_shelter, pattern: "^none|none drawn|no hs"}, {field: yard, pattern: "^none"}]}
    costs: Bulky items (luggage, vacuum, festive decorations) and laundry need a home elsewhere.
    who_less:
      - minimalist couples and singles; tenants
      - households who use a washer-dryer and own few bulky items
    who_more:
      - families with prams, toys and seasonal items
      - households with a helper (no helper's room or yard)
    workarounds:
      - bed frames with lift-up storage
      - one tall freestanding cabinet where a wall allows — check with fit.py
      - washer-dryer use instead of air-drying (the units already ship with WD in most of these plans; confirm on the plan)
      - {text: ceiling or balcony drying rack, needs_reno_check: true, reno_workaround: "ceiling or balcony drying rack"}

  - id: study_open_niche
    rubric: null
    title: Study is an open niche or alcove — no door, often no window
    detect: {any_field: [study, minuses], pattern: "niche|alcove|study[^|]{0,40}(no window|no door|has no window)"}
    costs: No privacy for calls; whoever works there has people walking behind them.
    who_less:
      - people who work from home now and then, or only take few calls
      - a child's homework corner
    who_more:
      - two people working from home full time with many calls
    workarounds:
      - a compact desk (0.5–0.6 m deep) and a closed-back chair facing the wall
      - a freestanding folding screen behind the chair — check the route past it with fit.py
      - a noise-cancelling headset (habit)

  - id: master_borrowed_light
    rubric: null
    title: Master bedroom has no window of its own — its light comes through the study
    detect: {any_field: [minuses], pattern: "master (bedroom )?has no window"}
    costs: The master's daylight and air depend on the study staying open.
    who_less:
      - a couple who use the study as a dressing room or a nursery joined to the master
    who_more:
      - anyone who wants to give the study to someone else
    workarounds:
      - keep the study open and furnish it as part of the master suite

  - id: shared_bathroom_two_bedrooms
    rubric: null
    title: One bathroom for two bedrooms
    detect: {field: bed_bath, pattern: "2 bed[^/]*/ 1 bath"}
    costs: Guests and the second bedroom share the master's bathroom or walk through to it.
    who_less:
      - singles and couples who use the second bedroom as a study or guest room
    who_more:
      - flatmates; a parent living in
    workarounds: []

  - id: tight_master_queen
    rubric: bedroom_viability
    title: Master is narrow for a queen with a walkway on both sides
    detect: {computed: bed_with_both_sides, room: master, bed_w: 1.62, bed_l: 1.95, side: 0.60, foot: 0.60,
             note: "queen 1.52 x 1.90 plus 0.05 frame a side (standards.yaml); both orientations tried; a wardrobe inside the room size is taken off either wall. Rooms whose size excludes the wardrobe may still be tighter — confirm on the plan"}
    costs: One side of the bed becomes a squeeze, or the bed goes against a wall.
    who_less:
      - one sleeper, or a couple happy with the bed against a wall
    who_more:
      - couples who both need their own bedside
    workarounds:
      - a queen with one side against the wall leaves the other side wide — check with fit.py
      - a super single for one sleeper

  - id: narrow_bedroom
    rubric: bedroom_viability
    title: A bedroom 2.4 m or narrower
    detect: {computed: any_bedroom_min_side_at_most, threshold_m: 2.40, note: "room size may include a 0.6-0.75 m wardrobe; clear floor is smaller — confirm on the plan"}
    costs: Takes a single or super single comfortably; a queen leaves little or no walkway.
    who_less:
      - a young child; a study or guest room; one adult
    who_more:
      - a couple in that room; two children sharing
    workarounds:
      - a single or super single along the long wall — check with fit.py
      - bed with storage under it instead of a chest of drawers

  - id: two_bedrooms_only
    rubric: null
    title: Two bedrooms
    detect: {field: category, pattern: "^2-Bedroom"}
    costs: No spare room once a family grows past one child.
    who_less:
      - couples without children (DINKs); singles; a couple with one baby for the first few years
      - investors renting to two professionals
    who_more:
      - families planning two or more children; a parent living in
    workarounds:
      - second bedroom as a study-guest room (desk plus single bed) — check with fit.py
      - {text: "open bedroom 2 into the living room, only where its wall is drawn as an outline (walltype.py)", needs_reno_check: true, reno_workaround: "knock down a bedroom wall"}
